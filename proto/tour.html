// ================= pick: what is under a tap =================

  case: 'Cabinets & built-ins', plumb: 'Plumbing fixtures', appl: 'Appliances', light: 'Lighting', floor: 'Floors', ceil: 'Ceilings', stair: 'Stairs', elec: 'Receptacles' };

// the chosen element glows: an overlay sphere with that element's pixels tinted, its outline stronger
const hlMat = new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, depthTest: false }); const hl = new THREE.Mesh(geo, hlMat); hl.renderOrder = 1; hl.visible = false; scene.add(hl);

// ================= comments =================
let comments = [], resolved = new Set(), me = store('haney-name') || '', sel = null, openId = null, draftImages = [], syncing = false;
const threads = () => comments.filter(c => !c.replyTo), openThreads = () => threads().filter(c => !resolved.has(c.id));
const numOf = c => resolved.has(c.id) ? '✓' : String(openThreads().indexOf(c) + 1);
const $ = id => document.getElementById(id), panel = $('panel'), pbody = $('pbody'), pinsEl = $('pins');
const h = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };

}

    const b = h('button', 'pin' + (openId === c.id ? ' open' : ''), String(i + 1)); b.style.left = sc.x + 'px'; b.style.top = sc.y + 'px'; b.title = c.author + ': ' + c.label;
    b.onclick = () => openThread(c.id); pinsEl.appendChild(b); });
  if (sel && !openId) { const sc = screenOf(sel.point, sel.id, true); if (sc) { const b = h('div', 'pin draft', '+'); b.style.left = sc.x + 'px'; b.style.top = sc.y + 'px'; pinsEl.appendChild(b); } }
}
function closePanel() { panel.hidden = true; openId = null; sel = null; hl.visible = false; draw(); }
$('pclose').onclick = closePanel;
addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('lightbox').hidden) $('lightbox').hidden = true; else if (!panel.hidden) closePanel(); } });
$('lightbox').onclick = () => $('lightbox').hidden = true;
function lightbox(url) { $('lbimg').src = url; $('lightbox').hidden = false; }
function choose(p) {   // a tap on the panorama: select what's there and open the comment box (a tap on sky clears)
  if (!p) { if (sel || openId) closePanel(); return; }
  sel = p; openId = null; highlight(p.k); renderPanel(); draw();
}
function openThread(id) { const c = comments.find(x => x.id === id); if (!c) return; openId = id; sel = null; const k = PICK ? PICK.ids.indexOf(c.objId) : -1; highlight(k > 0 ? k : 0); renderPanel(); draw(); }
function composer(onPost, placeholder) {
  const wrap = h('div'); draftImages = [];
  let nameIn = null; if (!me) { nameIn = h('input'); nameIn.type = 'text'; nameIn.placeholder = 'Your name'; nameIn.maxLength = 40; wrap.append(nameIn); }
  const ta = h('textarea'); ta.placeholder = placeholder; ta.maxLength = 4000; const thumbs = h('div', 'thumbs');
  const file = h('input'); file.type = 'file'; file.accept = 'image/*'; file.multiple = true; file.hidden = true;
  const attach = h('button', 'pbtn', 'Attach photos'); attach.type = 'button'; attach.onclick = () => file.click();
  const renderThumbs = () => { thumbs.textContent = ''; draftImages.forEach((im, i) => { const t = h('div', 'thumb'), img = h('img'); img.src = im.url; img.alt = 'Attached image ' + (i + 1); img.onclick = () => lightbox(im.url);

  file.onchange = () => addFiles(file.files); ta.addEventListener('paste', e => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); addFiles(fs); } });

async function saveComment(base, text, imgs) {

addEventListener('resize', size); size();
if (location.hostname === 'localhost') window.TDBG = { THREE, camera, markers, rc, go, SP, get cur() { return cur; }, draw, pickAt, choose, openThread, get comments() { return comments; }, get open() { return openThreads().map(c => c.id); }, set view(a) { lon = a[0]; lat = a[1]; draw(); } };
